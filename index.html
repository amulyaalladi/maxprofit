<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Profit Problem</title>
 <link rel="stylesheet" href="index.css">
</head>
<body>
<main>
  <h1>Max profit</h1>
  <p class="lead">Enter the total time units to find the building mix that earns the most.</p>

  <form id="form" novalidate>
    <input type="number" id="input" value="13" min="1" step="1" aria-label="Time units">
    <button type="submit">Calculate</button>
  </form>
  <p id="error" role="alert"></p>

  <table class="rates">
    <thead><tr><th>Building</th><th>Build time</th><th>Earns per unit</th></tr></thead>
    <tbody>
      <tr><td>Theatre (T)</td><td>5</td><td>$1,500</td></tr>
      <tr><td>Pub (P)</td><td>4</td><td>$1,000</td></tr>
      <tr><td>Commercial Park (C)</td><td>10</td><td>$2,000</td></tr>
    </tbody>
  </table>

  <div class="earnings" aria-live="polite">
    <strong id="earnings">$0</strong><span>maximum earnings</span>
  </div>
  <div id="solutions"></div>
  </main>

<script src="./index.js">
  
</script>
</body>
</html>
